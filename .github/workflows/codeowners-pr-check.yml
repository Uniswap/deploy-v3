name: CODEOWNERS Check on PR
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  check-codeowners-on-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check if CODEOWNERS exists and comment if missing
        run: |
          REPO="${{ github.event.pull_request.head.repo.name }}"
          PR_NUMBER=${{ github.event.pull_request.number }}
          
          # Check if CODEOWNERS file exists
          if curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/Uniswap/$REPO/contents/.github/CODEOWNERS \
            | grep -q '"message": "Not Found"'; then
            
            # File doesn't exist, post comment
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/Uniswap/$REPO/issues/$PR_NUMBER/comments \
              -d '{
                "body": "🚫 **This repo is missing a `.github/CODEOWNERS` file**\n\nThis is required for code review enforcement. Please create it:\n\n```\n# .github/CODEOWNERS\n* @Uniswap/your-team\n```\n\nOnce committed and pushed, this check will pass. [Learn more about CODEOWNERS](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners)"
              }'
          fi
